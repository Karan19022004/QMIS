# Alembic configuration. The database URL is NOT stored here: alembic/env.py reads it from the
# application settings (DATABASE_URL / backend/.env), so no credentials live in a tracked file.
#
# Usage (from the backend folder):
#   alembic current          # which revision this database is on
#   alembic upgrade head     # apply pending migrations
#   alembic downgrade -1     # undo the last one
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
