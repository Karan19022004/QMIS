server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: cache for 7 days, real 404 when missing
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # index.html must not be cached, so a new deploy shows up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes fall back to the SPA entry point
    location / {
        try_files $uri $uri/ /index.html;
    }
}
